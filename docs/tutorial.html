<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isle of Ants — Tutorial</title>

  <!-- Shared typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- marked.js — client-side Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <style>
    /* ── Design tokens (mirrors app palette) ─────────────────────────── */
    :root {
      --bg:           #090e0b;
      --surface:      #0f1a12;
      --surface2:     #162019;
      --surface3:     #1e2e22;
      --border:       #253828;
      --border-hi:    #3a5a42;
      --text:         #ddd5bc;
      --text-muted:   #637a6a;
      --accent:       #c8961e;
      --accent-hi:    #e0ac30;
      --success:      #4eb86a;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-ui:      'DM Sans', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'Fira Code', monospace;
      --nav-w:        220px;
      --content-max:  720px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.7;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar nav ──────────────────────────────────────────────────── */
    nav {
      width: var(--nav-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0 32px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .nav-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--accent);
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .nav-title a {
      color: inherit;
      text-decoration: none;
    }

    nav a {
      display: block;
      padding: 7px 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      border-left: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    nav a:hover {
      color: var(--text);
      background: var(--surface2);
    }

    nav a.active {
      color: var(--accent-hi);
      border-left-color: var(--accent);
      background: var(--surface2);
      font-weight: 500;
    }

    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 10px 20px;
    }

    .nav-back {
      margin-top: auto;
      padding: 14px 20px 0;
    }

    .nav-back a {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-back a:hover { color: var(--text); }

    /* ── Main content ─────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 48px 40px 80px;
      max-width: calc(var(--nav-w) + var(--content-max));
    }

    #content {
      max-width: var(--content-max);
    }

    /* Loading / error states */
    .status {
      color: var(--text-muted);
      font-style: italic;
      padding: 32px 0;
    }

    /* ── Markdown prose styles ────────────────────────────────────────── */
    #content h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent-hi);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    #content h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin: 36px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    #content h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      margin: 24px 0 8px;
    }

    #content p {
      margin-bottom: 14px;
    }

    #content ul, #content ol {
      margin: 0 0 14px 24px;
    }

    #content li {
      margin-bottom: 6px;
    }

    #content li p { margin-bottom: 4px; }

    #content strong { color: var(--text); font-weight: 600; }

    #content em { color: var(--text-muted); font-style: italic; }

    #content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    /* Inline code */
    #content code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--surface3);
      border: 1px solid var(--border-hi);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--success);
    }

    /* Code blocks */
    #content pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin: 0 0 16px;
      overflow-x: auto;
    }

    #content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.9em;
      color: var(--text);
    }

    /* Blockquotes (used for callouts and tips) */
    #content blockquote {
      border-left: 3px solid var(--accent);
      background: var(--surface2);
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      margin: 0 0 16px;
      color: var(--text-muted);
    }

    #content blockquote p { margin-bottom: 0; }

    #content blockquote strong { color: var(--accent-hi); }

    /* Tables */
    #content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 16px;
      font-size: 0.9em;
    }

    #content th {
      background: var(--surface3);
      color: var(--accent);
      font-weight: 600;
      text-align: left;
      padding: 8px 12px;
      border: 1px solid var(--border);
    }

    #content td {
      padding: 7px 12px;
      border: 1px solid var(--border);
      color: var(--text);
    }

    #content tr:nth-child(even) td {
      background: var(--surface);
    }

    /* Check Your Understanding section */
    #content h2:last-of-type { margin-bottom: 12px; }

    /* Nav links at bottom of each activity */
    #content p:last-child a,
    #content p:last-child em a {
      color: var(--accent);
      text-decoration: none;
    }
    #content p:last-child a:hover { color: var(--accent-hi); text-decoration: underline; }

    /* All other links */
    #content a {
      color: var(--accent);
      text-decoration: none;
    }
    #content a:hover { color: var(--accent-hi); text-decoration: underline; }
  </style>
</head>
<body>

<div class="layout">

  <!-- ── Sidebar ── -->
  <nav>
    <div class="nav-title">Isle of Ants<br>Tutorial</div>

    <a href="tutorial.html?page=ACTIVITY1"  data-page="ACTIVITY1">Activity 1 — The Island</a>
    <a href="tutorial.html?page=ACTIVITY2"  data-page="ACTIVITY2">Activity 2 — First Move</a>
    <a href="tutorial.html?page=ACTIVITY3"  data-page="ACTIVITY3">Activity 3 — Chase Ants</a>
    <a href="tutorial.html?page=ACTIVITY4"  data-page="ACTIVITY4">Activity 4 — Debugging</a>
    <a href="tutorial.html?page=ACTIVITY5"  data-page="ACTIVITY5">Activity 5 — Strategies</a>

    <div class="nav-back">
      <a href="index.html">← Back to app</a>
    </div>
  </nav>

  <!-- ── Content ── -->
  <main>
    <div id="content"><p class="status">Loading…</p></div>
  </main>

</div>

<script>
  const NAV_LINKS = document.querySelectorAll('nav a[data-page]');
  const CONTENT   = document.getElementById('content');

  function getPage() {
    return new URLSearchParams(window.location.search).get('page') || 'ACTIVITY1';
  }

  function setActive(page) {
    NAV_LINKS.forEach(a => {
      a.classList.toggle('active', a.dataset.page === page);
    });
  }

  async function loadPage(page) {
    setActive(page);
    CONTENT.innerHTML = '<p class="status">Loading…</p>';
    try {
      const res = await fetch(`${page}.md`);
      if (!res.ok) {
        CONTENT.innerHTML = `<p class="status">Activity not yet available.</p>`;
        return;
      }
      const md = await res.text();
      CONTENT.innerHTML = marked.parse(md);
      window.scrollTo(0, 0);
    } catch (e) {
      CONTENT.innerHTML = `<p class="status">Could not load content.</p>`;
    }
  }

  // Handle browser back/forward
  window.addEventListener('popstate', () => loadPage(getPage()));

  // Intercept in-page nav clicks so the page doesn't fully reload
  document.querySelector('nav').addEventListener('click', e => {
    const link = e.target.closest('a[data-page]');
    if (!link) return;
    e.preventDefault();
    const page = link.dataset.page;
    history.pushState({}, '', `tutorial.html?page=${page}`);
    loadPage(page);
  });

  // Intercept prev/next links rendered inside the Markdown content
  CONTENT.addEventListener('click', e => {
    const link = e.target.closest('a');
    if (!link) return;
    const href = link.getAttribute('href');
    if (!href) return;
    // Match ACTIVITY*.md links
    const m = href.match(/^(ACTIVITY\d+)\.md$/);
    if (!m) return;
    e.preventDefault();
    const page = m[1];
    history.pushState({}, '', `tutorial.html?page=${page}`);
    loadPage(page);
  });

  // Initial load
  loadPage(getPage());
</script>

</body>
</html>
